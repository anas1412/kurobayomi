[package]
name = "kuro-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["platform-linux"]
platform-linux = ["dep:keyring"]
platform-windows = []
platform-macos = []

[dependencies]
async-channel = { workspace = true }
async-trait = { workspace = true }
chacha20poly1305 = "0.10.1"
directories = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.151"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
tokio-util = { workspace = true }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.34"
gio = "0.22.10"
keyring = { workspace = true, optional = true }
rustix = { version = "1", features = ["fs"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
zbus = "5.13.2"
webkit6 = "0.6"
# webkit6 needs GTK's 4.10+ API switched on; the app does that too (v4_14), this keeps the crate building on its own
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time", "net", "io-util"] }
tempfile = { workspace = true }
