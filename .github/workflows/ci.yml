name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # GTK 4.16 is needed for the gtk4 v4_16 feature; Ubuntu 24.04 ships 4.14.
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # libdav1d-devel: image's avif-native feature builds dav1d-sys, which needs dav1d.pc.
        # mpv-devel (libmpv) comes from RPM Fusion; kuro-player links it.
        run: |
          dnf install -y gcc pkgconf-pkg-config gtk4-devel libdav1d-devel ripgrep curl
          dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf install -y mpv-devel

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Platform boundary check
        run: scripts/check-platform-boundary.sh

      - name: Literal path check
        run: scripts/check-path-literals.sh

      - name: Tests
        # The default debug build of this workspace fills the runner disk, so build without debug symbols or incremental data.
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace

      - name: Disk space left
        if: always()
        run: df -h / /__w | cat
