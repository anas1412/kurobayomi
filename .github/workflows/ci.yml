name: CI

# Runs only when something that is compiled or checked changes; README, docs, plans and other text do not start a run.
on:
  push:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # libdav1d-dev: image's avif-native feature builds dav1d-sys, which needs dav1d.pc.
        # libmpv-dev: kuro-player links libmpv. Ubuntu 24.04 ships GTK 4.14, which is what the gtk4 v4_14 feature targets.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libdav1d-dev libmpv-dev ripgrep

      - name: Update Rust
        run: rustup update stable

      - name: Platform boundary check
        run: scripts/check-platform-boundary.sh

      - name: Literal path check
        run: scripts/check-path-literals.sh

      - name: Tests
        # The default debug build of this workspace fills the runner disk, so build without debug symbols or incremental data.
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace

      - name: Disk space left
        if: always()
        run: df -h / | cat
