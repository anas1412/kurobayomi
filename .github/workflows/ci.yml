name: CI

# Runs only when something that is compiled or checked changes; README, docs, plans and other text do not start a run.
on:
  push:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  # a manual run, so a commit that no push run covers (a docs-only commit under a release tag) can still get its CI result
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        # libdav1d-dev: image's avif-native feature builds dav1d-sys, which needs dav1d.pc.
        # libmpv-dev: kuro-player links libmpv. desktop-file-utils: tests run desktop-file-validate. Ubuntu 24.04 ships GTK 4.14, which is what the gtk4 v4_14 feature targets.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libdav1d-dev libmpv-dev ripgrep desktop-file-utils libxml2-utils

      - name: Update Rust
        run: rustup update stable

      # Keeps the compiled dependencies between runs: without it every run builds the whole workspace from scratch,
      # which was about 9 of the 10 minutes of the Tests step.
      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Platform boundary check
        run: scripts/check-platform-boundary.sh

      - name: Literal path check
        run: scripts/check-path-literals.sh

      - name: Tests
        # The default debug build of this workspace fills the runner disk, so build without debug symbols or incremental data.
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace

      - name: Disk space left
        if: always()
        run: df -h / | cat
