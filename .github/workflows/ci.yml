name: CI

# Runs only when something that is compiled or checked changes; README, docs, plans and other text do not start a run.
on:
  push:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'spec/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'
  # a manual run, so a commit that no push run covers (a docs-only commit under a release tag) can still get its CI result
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'spec/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  # to pull the build image
  packages: read

# bash, as on the plain runners: in a container a step's default shell is sh
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    # Ubuntu 24.04 with every system package already in it (ci/Dockerfile, built by build-image.yml): nothing is
    # installed from Ubuntu's mirror here, which once held a run for over an hour
    container:
      image: ghcr.io/${{ github.repository_owner }}/kurobayomi-build:noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update stable

      # Keeps the compiled dependencies between runs: without it every run builds the whole workspace from scratch,
      # which was about 9 of the 10 minutes of the Tests step.
      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Platform boundary check
        run: scripts/check-platform-boundary.sh

      - name: Literal path check
        run: scripts/check-path-literals.sh

      - name: Tests
        # The default debug build of this workspace fills the runner disk, so build without debug symbols or incremental data.
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace

      - name: Disk space left
        if: always()
        run: df -h / | cat

  # The Windows port (plans/addenda/requirements-cross-platform.md, rule 7): the crates that already build for Windows
  # stay building. The others wait for the GTK, mpv and dav1d libraries (an MSYS2 toolchain); add a crate here once it
  # builds.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets -p kuro-platform -p kuro-i18n -p kuro-prefs -p kuro-db -p kuro-data

  # The whole app built on Windows with the MSYS2 UCRT64 toolchain whose GTK, mpv, dav1d and libarchive the installer
  # bundles. Not required yet (continue-on-error): it shows what still breaks. Once it passes, it becomes required and
  # windows-check above is removed.
  windows-build:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      # MSYS2's own Rust (not rustup), so the compiler, the linker and the libraries all come from UCRT64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p rust:p pkgconf:p cmake:p nasm:p
            gtk4:p mpv:p dav1d:p libarchive:p

      - name: Build
        run: cargo build --locked
