name: Build image

# Builds the machine CI, the nightly and the stable release run in (ci/Dockerfile) and publishes it as
# ghcr.io/<owner>/kurobayomi-build. Two tags: `noble`, which the workflows use, and `noble-<commit>`, kept so a bad image
# can be rolled back by naming the older tag in those workflows' `container: image:` line.
on:
  push:
    branches: [main]
    paths:
      - 'ci/Dockerfile'
      - '.github/workflows/build-image.yml'
  # weekly, so the AppImage does not keep shipping libraries that Ubuntu has fixed since
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Log in to the package registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ci
          push: true
          # the label links the package to this repository, so this repository's workflows may pull it
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kurobayomi-build:noble
            ghcr.io/${{ github.repository_owner }}/kurobayomi-build:noble-${{ github.sha }}
