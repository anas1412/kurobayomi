name: Feature request
description: Suggest a feature to improve Kurobayomi
labels: [Feature request]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: How can Kurobayomi be improved?
      placeholder: |
        Example:
          "It should work like this..."
    validations:
      required: true

  - type: input
    id: kurobayomi-version
    attributes:
      label: Kurobayomi version
      description: Run `kurobayomi --version`, or open the About dialog.
      placeholder: |
        Example: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, we will close and ignore your issue if you skimmed through this.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: If this is a request regarding an extension, I should be opening an issue in the extension's repository.
          required: true
        - label: I have updated the app to the [latest release](https://github.com/anas1412/kurobayomi/releases/latest).
          required: true
        - label: I will fill out all of the requested information in this form.
          required: true
